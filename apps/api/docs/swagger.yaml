basePath: /api/v1
definitions:
  dto.ActivityFeedResponse:
    properties:
      activities:
        items:
          $ref: '#/definitions/dto.ActivityResponse'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  dto.ActivityResponse:
    properties:
      action:
        type: string
      avatar_url:
        type: string
      created_at:
        type: string
      display_name:
        type: string
      entity_id:
        type: integer
      entity_type:
        type: string
      id:
        type: integer
      metadata:
        additionalProperties: true
        type: object
      user_id:
        type: integer
      username:
        type: string
    type: object
  dto.AddReactionRequest:
    properties:
      type:
        enum:
        - LIKE
        - LOVE
        - LAUGH
        - SAD
        - ANGRY
        type: string
    required:
    - type
    type: object
  dto.AddToWatchlistRequest:
    properties:
      notes:
        type: string
      rank:
        type: number
    type: object
  dto.AdvancedSearchResponse:
    properties:
      limit:
        type: integer
      movies:
        items:
          $ref: '#/definitions/dto.MovieResponse'
        type: array
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  dto.AuthResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.BadRequestError:
    properties:
      code:
        example: BAD_REQUEST
        type: string
      message:
        example: invalid request
        type: string
    type: object
  dto.BadRequestErrorResponse:
    properties:
      error:
        $ref: '#/definitions/dto.BadRequestError'
      success:
        example: false
        type: boolean
    type: object
  dto.CommentResponse:
    properties:
      avatar_url:
        type: string
      content:
        type: string
      created_at:
        type: string
      display_name:
        type: string
      id:
        type: integer
      like_count:
        type: integer
      movie_id:
        type: integer
      parent_id:
        type: integer
      reply_count:
        type: integer
      updated_at:
        type: string
      user_id:
        type: integer
      username:
        type: string
    type: object
  dto.CommentWithMovieResponse:
    properties:
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      like_count:
        type: integer
      movie_id:
        type: integer
      movie_slug:
        type: string
      movie_title:
        type: string
      parent_id:
        type: integer
      updated_at:
        type: string
    type: object
  dto.ConflictErrorInfo:
    properties:
      code:
        example: CONFLICT
        type: string
      message:
        example: resource already exists
        type: string
    type: object
  dto.ConflictErrorResponse:
    properties:
      error:
        $ref: '#/definitions/dto.ConflictErrorInfo'
      success:
        example: false
        type: boolean
    type: object
  dto.CountData:
    properties:
      count:
        example: 12
        type: integer
    type: object
  dto.CreateActivityRequest:
    properties:
      action:
        type: string
      entity_id:
        type: integer
      entity_type:
        type: string
      metadata:
        additionalProperties: true
        type: object
    required:
    - action
    - entity_id
    - entity_type
    type: object
  dto.CreateCommentRequest:
    properties:
      content:
        maxLength: 2000
        minLength: 1
        type: string
    required:
    - content
    type: object
  dto.FollowStatsResponse:
    properties:
      follower_count:
        type: integer
      following_count:
        type: integer
    type: object
  dto.FollowStatusData:
    properties:
      is_following:
        example: true
        type: boolean
    type: object
  dto.FollowUserResponse:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      display_name:
        type: string
      followed_at:
        type: string
      id:
        type: integer
      username:
        type: string
    type: object
  dto.ForbiddenErrorInfo:
    properties:
      code:
        example: FORBIDDEN
        type: string
      message:
        example: you are not allowed to perform this action
        type: string
    type: object
  dto.ForbiddenErrorResponse:
    properties:
      error:
        $ref: '#/definitions/dto.ForbiddenErrorInfo'
      success:
        example: false
        type: boolean
    type: object
  dto.GenreResponse:
    properties:
      id:
        type: integer
      name:
        type: string
      slug:
        type: string
    type: object
  dto.GenreWithCountResponse:
    properties:
      id:
        type: integer
      movie_count:
        type: integer
      name:
        type: string
      slug:
        type: string
    type: object
  dto.InternalServerErrorInfo:
    properties:
      code:
        example: INTERNAL_SERVER_ERROR
        type: string
      message:
        example: internal server error
        type: string
    type: object
  dto.InternalServerErrorResponse:
    properties:
      error:
        $ref: '#/definitions/dto.InternalServerErrorInfo'
      success:
        example: false
        type: boolean
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.MessageData:
    properties:
      message:
        example: operation completed successfully
        type: string
    type: object
  dto.MovieResponse:
    properties:
      backdrop_url:
        type: string
      content_rating:
        type: string
      country:
        type: string
      genres:
        items:
          type: string
        type: array
      id:
        type: integer
      imdb_id:
        type: string
      imdb_rating:
        type: number
      letterboxd_rating:
        type: number
      metacritic_score:
        type: integer
      original_language:
        type: string
      overview:
        type: string
      poster_url:
        type: string
      release_date:
        type: string
      rotten_tomatoes:
        type: integer
      runtime:
        type: integer
      slug:
        type: string
      title:
        type: string
      tmdb_id:
        type: integer
      trailer_url:
        type: string
      user_avg_rating:
        type: number
      user_rating_count:
        type: integer
    type: object
  dto.NotFoundErrorInfo:
    properties:
      code:
        example: NOT_FOUND
        type: string
      message:
        example: resource not found
        type: string
    type: object
  dto.NotFoundErrorResponse:
    properties:
      error:
        $ref: '#/definitions/dto.NotFoundErrorInfo'
      success:
        example: false
        type: boolean
    type: object
  dto.NotificationListResponse:
    properties:
      limit:
        type: integer
      notifications:
        items:
          $ref: '#/definitions/dto.NotificationResponse'
        type: array
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
      unread_count:
        type: integer
    type: object
  dto.NotificationResponse:
    properties:
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      is_read:
        type: boolean
      metadata:
        additionalProperties: true
        type: object
      title:
        type: string
      type:
        type: string
      user_id:
        type: integer
    type: object
  dto.RateMovieRequest:
    properties:
      score:
        maximum: 10
        minimum: 1
        type: integer
    required:
    - score
    type: object
  dto.RatingResponse:
    properties:
      created_at:
        type: string
      id:
        type: integer
      movie_id:
        type: integer
      score:
        type: integer
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  dto.RatingWithMovieResponse:
    properties:
      created_at:
        type: string
      id:
        type: integer
      movie_id:
        type: integer
      poster_url:
        type: string
      score:
        type: integer
      slug:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  dto.RatingWithUserResponse:
    properties:
      avatar_url:
        type: string
      created_at:
        type: string
      display_name:
        type: string
      id:
        type: integer
      score:
        type: integer
      user_id:
        type: integer
      username:
        type: string
    type: object
  dto.ReactionCountResponse:
    properties:
      count:
        type: integer
      type:
        type: string
    type: object
  dto.ReactionMutationData:
    properties:
      created_at:
        type: string
      id:
        type: integer
      type:
        type: string
    type: object
  dto.ReactionResponse:
    properties:
      avatar_url:
        type: string
      created_at:
        type: string
      display_name:
        type: string
      id:
        type: integer
      type:
        type: string
      user_id:
        type: integer
      username:
        type: string
    type: object
  dto.ReactionSummaryResponse:
    properties:
      counts:
        items:
          $ref: '#/definitions/dto.ReactionCountResponse'
        type: array
      user_reaction:
        type: string
    type: object
  dto.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  dto.SignupRequest:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
      username:
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  dto.SuccessResponse:
    properties:
      data: {}
      success:
        example: true
        type: boolean
    type: object
  dto.UnauthorizedErrorInfo:
    properties:
      code:
        example: UNAUTHORIZED
        type: string
      message:
        example: authentication required
        type: string
    type: object
  dto.UnauthorizedErrorResponse:
    properties:
      error:
        $ref: '#/definitions/dto.UnauthorizedErrorInfo'
      success:
        example: false
        type: boolean
    type: object
  dto.UnreadCountData:
    properties:
      unread_count:
        example: 3
        type: integer
    type: object
  dto.UpdateCommentRequest:
    properties:
      content:
        maxLength: 2000
        minLength: 1
        type: string
    required:
    - content
    type: object
  dto.UpdateProfileRequest:
    properties:
      avatar_url:
        type: string
      bio:
        maxLength: 500
        type: string
      display_name:
        maxLength: 100
        type: string
    type: object
  dto.UpdateWatchlistRequest:
    properties:
      notes:
        type: string
      rank:
        type: number
    type: object
  dto.UserProfileResponse:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      comment_count:
        type: integer
      created_at:
        type: string
      display_name:
        type: string
      follower_count:
        type: integer
      following_count:
        type: integer
      id:
        type: integer
      rating_count:
        type: integer
      username:
        type: string
    type: object
  dto.UserResponse:
    properties:
      display_name:
        type: string
      email:
        type: string
      id:
        type: integer
      username:
        type: string
    type: object
  dto.UserSearchResult:
    properties:
      avatar_url:
        type: string
      display_name:
        type: string
      id:
        type: integer
      username:
        type: string
    type: object
  dto.WatchlistCountResponse:
    properties:
      total:
        type: integer
      unwatched:
        type: integer
      watched:
        type: integer
    type: object
  dto.WatchlistEntryResponse:
    properties:
      created_at:
        type: string
      id:
        type: integer
      movie_id:
        type: integer
      notes:
        type: string
      rank_position:
        type: number
      watched_at:
        type: string
    type: object
  dto.WatchlistItemResponse:
    properties:
      created_at:
        type: string
      id:
        type: integer
      movie_id:
        type: integer
      notes:
        type: string
      poster_url:
        type: string
      rank_position:
        type: number
      release_date:
        type: string
      runtime:
        type: integer
      slug:
        type: string
      title:
        type: string
      user_avg_rating:
        type: number
      watched_at:
        type: string
    type: object
  dto.WatchlistStatusData:
    properties:
      in_watchlist:
        example: true
        type: boolean
    type: object
host: localhost:8080
info:
  contact:
    email: support@filmophilia.com
    name: API Support
  description: API for Filmophilia - A movie discovery and social platform. JSON endpoints
    return `{success,data}` on success and `{success,error}` on failure.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Filmophilia API
  version: "1.0"
paths:
  /activities:
    post:
      consumes:
      - application/json
      description: Log a user activity (rating, comment, watchlist action, etc.)
      parameters:
      - description: Activity details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateActivityRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Activity created
          schema:
            allOf:
            - $ref: '#/definitions/dto.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.MessageData'
              type: object
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/dto.BadRequestErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.InternalServerErrorResponse'
      security:
      - BearerAuth: []
      summary: Create an activity
      tags:
      - activities
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login with email and password to get access and refresh tokens
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Authenticated successfully
          schema:
            allOf:
            - $ref: '#/definitions/dto.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.AuthResponse'
              type: object
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/dto.BadRequestErrorResponse'
        "401":
          description: Invalid credentials or user banned
          schema:
            $ref: '#/definitions/dto.UnauthorizedErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.InternalServerErrorResponse'
      summary: Authenticate user
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Invalidate the refresh token to logout the user
      parameters:
      - description: Refresh token to invalidate
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Logged out successfully
          schema:
            allOf:
            - $ref: '#/definitions/dto.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.MessageData'
              type: object
        "400":
          description: Refresh token required
          schema:
            $ref: '#/definitions/dto.BadRequestErrorResponse'
        "500":
          description: Failed to logout
          schema:
            $ref: '#/definitions/dto.InternalServerErrorResponse'
      summary: Logout user
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Get a new access token using a valid refresh token
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Token refreshed
          schema:
            allOf:
            - $ref: '#/definitions/dto.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.AuthResponse'
              type: object
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/dto.BadRequestErrorResponse'
        "401":
          description: Invalid or expired refresh token
          schema:
            $ref: '#/definitions/dto.UnauthorizedErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.InternalServerErrorResponse'
      summary: Refresh access token
      tags:
      - auth
  /auth/signup:
    post:
      consumes:
      - application/json
      description: Create a new user account with email, username, and password
      parameters:
      - description: Signup credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.SignupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User created
          schema:
            allOf:
            - $ref: '#/definitions/dto.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.UserResponse'
              type: object
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/dto.BadRequestErrorResponse'
        "409":
          description: Email or username already exists
          schema:
            $ref: '#/definitions/dto.ConflictErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.InternalServerErrorResponse'
      summary: Register a new user
      tags:
      - auth
  /comments/{commentId}:
    delete:
      description: Delete your own comment
      parameters:
      - description: Comment ID
        in: path
        name: commentId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Comment deleted
          schema:
            allOf:
            - $ref: '#/definitions/dto.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.MessageData'
              type: object
        "400":
          description: Invalid comment ID
          schema:
            $ref: '#/definitions/dto.BadRequestErrorResponse'
        "403":
          description: Not authorized
          schema:
            $ref: '#/definitions/dto.ForbiddenErrorResponse'
        "404":
          description: Comment not found
          schema:
            $ref: '#/definitions/dto.NotFoundErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.InternalServerErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a comment
      tags:
      - comments
    get:
      description: Get a specific comment by ID
      parameters:
      - description: Comment ID
        in: path
        name: commentId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Comment details
          schema:
            allOf:
            - $ref: '#/definitions/dto.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.CommentResponse'
              type: object
        "400":
          description: Invalid comment ID
          schema:
            $ref: '#/definitions/dto.BadRequestErrorResponse'
        "404":
          description: Comment not found
          schema:
            $ref: '#/definitions/dto.NotFoundErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.InternalServerErrorResponse'
      summary: Get a comment
      tags:
      - comments
    patch:
      consumes:
      - application/json
      description: Update the content of your own comment
      parameters:
      - description: Comment ID
        in: path
        name: commentId
        required: true
        type: integer
      - description: New content
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateCommentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated comment
          schema:
            allOf:
            - $ref: '#/definitions/dto.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.CommentResponse'
              type: object
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/dto.BadRequestErrorResponse'
        "403":
          description: Not authorized
          schema:
            $ref: '#/definitions/dto.ForbiddenErrorResponse'
        "404":
          description: Comment not found
          schema:
            $ref: '#/definitions/dto.NotFoundErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.InternalServerErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a comment
      tags:
      - comments
  /comments/{commentId}/reactions:
    delete:
      description: Remove your reaction from a comment
      parameters:
      - description: Comment ID
        in: path
        name: commentId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Reaction removed
          schema:
            allOf:
            - $ref: '#/definitions/dto.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.MessageData'
              type: object
        "400":
          description: Invalid comment ID
          schema:
            $ref: '#/definitions/dto.BadRequestErrorResponse'
        "404":
          description: Reaction not found
          schema:
            $ref: '#/definitions/dto.NotFoundErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.InternalServerErrorResponse'
      security:
      - BearerAuth: []
      summary: Remove reaction from comment
      tags:
      - reactions
    get:
      description: Get all reactions on a comment
      parameters:
      - description: Comment ID
        in: path
        name: commentId
        required: true
        type: integer
      - default: 50
        description: Results per page
        in: query
        name: limit
        type: integer
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of reactions
          schema:
            allOf:
            - $ref: '#/definitions/dto.SuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.ReactionResponse'
                  type: array
              type: object
        "400":
          description: Invalid comment ID
          schema:
            $ref: '#/definitions/dto.BadRequestErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.InternalServerErrorResponse'
      summary: Get comment reactions
      tags:
      - reactions
    post:
      consumes:
      - application/json
      description: Add or update a reaction (like, love, etc.) to a comment
      parameters:
      - description: Comment ID
        in: path
        name: commentId
        required: true
        type: integer
      - description: Reaction type
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.AddReactionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Reaction created or updated
          schema:
            allOf:
            - $ref: '#/definitions/dto.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.ReactionMutationData'
              type: object
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/dto.BadRequestErrorResponse'
        "404":
          description: Comment not found
          schema:
            $ref: '#/definitions/dto.NotFoundErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.InternalServerErrorResponse'
      security:
      - BearerAuth: []
      summary: React to a comment
