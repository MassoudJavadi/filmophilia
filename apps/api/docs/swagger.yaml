basePath: /api/v1
definitions:
  github_com_MassoudJavadi_filmophilia_api_internal_dto.AddReactionRequest:
    properties:
      type:
        enum:
        - LIKE
        - LOVE
        - LAUGH
        - SAD
        - ANGRY
        type: string
    required:
    - type
    type: object
  github_com_MassoudJavadi_filmophilia_api_internal_dto.AddToWatchlistRequest:
    properties:
      notes:
        type: string
      rank:
        type: number
    type: object
  github_com_MassoudJavadi_filmophilia_api_internal_dto.AuthResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/github_com_MassoudJavadi_filmophilia_api_internal_dto.UserResponse'
    type: object
  github_com_MassoudJavadi_filmophilia_api_internal_dto.CreateActivityRequest:
    properties:
      action:
        type: string
      entity_id:
        type: integer
      entity_type:
        type: string
      metadata:
        additionalProperties: true
        type: object
    required:
    - action
    - entity_id
    - entity_type
    type: object
  github_com_MassoudJavadi_filmophilia_api_internal_dto.CreateCommentRequest:
    properties:
      content:
        maxLength: 2000
        minLength: 1
        type: string
    required:
    - content
    type: object
  github_com_MassoudJavadi_filmophilia_api_internal_dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  github_com_MassoudJavadi_filmophilia_api_internal_dto.RateMovieRequest:
    properties:
      score:
        maximum: 10
        minimum: 1
        type: integer
    required:
    - score
    type: object
  github_com_MassoudJavadi_filmophilia_api_internal_dto.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  github_com_MassoudJavadi_filmophilia_api_internal_dto.SignupRequest:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
      username:
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  github_com_MassoudJavadi_filmophilia_api_internal_dto.UpdateCommentRequest:
    properties:
      content:
        maxLength: 2000
        minLength: 1
        type: string
    required:
    - content
    type: object
  github_com_MassoudJavadi_filmophilia_api_internal_dto.UpdateProfileRequest:
    properties:
      avatar_url:
        type: string
      bio:
        maxLength: 500
        type: string
      display_name:
        maxLength: 100
        type: string
    type: object
  github_com_MassoudJavadi_filmophilia_api_internal_dto.UpdateWatchlistRequest:
    properties:
      notes:
        type: string
      rank:
        type: number
    type: object
  github_com_MassoudJavadi_filmophilia_api_internal_dto.UserResponse:
    properties:
      display_name:
        type: string
      email:
        type: string
      id:
        type: integer
      username:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@filmophilia.com
    name: API Support
  description: API for Filmophilia - A movie discovery and social platform
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Filmophilia API
  version: "1.0"
paths:
  /activities:
    post:
      consumes:
      - application/json
      description: Log a user activity (rating, comment, watchlist action, etc.)
      parameters:
      - description: Activity details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_MassoudJavadi_filmophilia_api_internal_dto.CreateActivityRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Activity created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create an activity
      tags:
      - activities
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login with email and password to get access and refresh tokens
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_MassoudJavadi_filmophilia_api_internal_dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MassoudJavadi_filmophilia_api_internal_dto.AuthResponse'
        "400":
          description: Invalid request body
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid credentials or user banned
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Authenticate user
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Invalidate the refresh token to logout the user
      parameters:
      - description: Refresh token to invalidate
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_MassoudJavadi_filmophilia_api_internal_dto.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Logged out successfully
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Refresh token required
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Failed to logout
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Logout user
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Get a new access token using a valid refresh token
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_MassoudJavadi_filmophilia_api_internal_dto.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_MassoudJavadi_filmophilia_api_internal_dto.AuthResponse'
        "400":
          description: Invalid request body
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid or expired refresh token
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh access token
      tags:
      - auth
  /auth/signup:
    post:
      consumes:
      - application/json
      description: Create a new user account with email, username, and password
      parameters:
      - description: Signup credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_MassoudJavadi_filmophilia_api_internal_dto.SignupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_MassoudJavadi_filmophilia_api_internal_dto.UserResponse'
        "400":
          description: Invalid request body
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Email or username already exists
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - auth
  /comments/{commentId}:
    delete:
      description: Delete your own comment
      parameters:
      - description: Comment ID
        in: path
        name: commentId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Comment deleted
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid comment ID
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Not authorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Comment not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
